# Extension metadata
name=Channel Names Viewer
description=A small always-visible legend window showing the currently selected fluorescence channels. Updates live as channels are toggled in Brightness/Contrast.

# Menu items
menu.open=Channel Names Viewer...
menu.autoContrast=Background-aware auto contrast...
menu.colorWheel=Channel color wheel...
menu.channelGrid=Channel grid viewer...
tooltip.menu.autoContrast=Set each channel's display range so its background shows as black, not as haze.
tooltip.menu.colorWheel=Give the visible channels evenly spaced colors from a color wheel.
tooltip.menu.channelGrid=Show each channel, or each display preset, in its own panel that follows the main viewer.

# Tooltips (toolbar + menu)
# The toolbar button, menu item and shortcut all show the legend, or hide it if shown.
tooltip.toolbar=Show or hide the channel-name legend (Ctrl/Cmd+Shift+C). Right-click for settings and channel tools.
tooltip.menu=Show or hide a small window listing the channels shown in the viewer.

# Empty-state strings
empty.headline=No fluorescence channels
empty.subtitle.rgb=(this image is RGB; channels do not apply)
empty.subtitle.noImage=(open an image to see its channels)
empty.subtitle.zeroSelected=(open Brightness/Contrast and select channels)
